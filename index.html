<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Clincoo AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --sidebar: #161b22;
      --card: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --user-bg: #6366f1;
      --ai-bg: #21262d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--sidebar);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .topbar .logo {
      font-size: 17px;
      font-weight: 700;
    }

    .topbar .logo span { color: var(--primary); }

    .menu-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      flex-shrink: 0;
      z-index: 40;
      transition: transform 0.25s ease;
    }

    .sidebar .logo {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar .logo span { color: var(--primary); }

    .sidebar label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    .model-select, .api-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .model-select:focus, .api-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .new-chat-btn:hover { background: var(--primary-hover); }

    .info {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-top: auto;
      padding-top: 16px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 30;
    }

    .overlay.show { display: block; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 90%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.user .avatar { background: var(--primary); }
    .message.assistant .avatar { background: #238636; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 6px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    .input-area {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      align-items: flex-end;
    }

    .input-box:focus-within { border-color: var(--primary); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      outline: none;
      line-height: 1.45;
      min-height: 24px;
    }

    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) { background: var(--primary-hover); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .welcome {
      text-align: center;
      margin: auto;
      padding: 32px 16px;
      color: var(--muted);
    }

    .welcome h1 {
      font-size: 24px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .suggestion:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    @media (max-width: 768px) {
      .topbar { display: flex; }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .message { max-width: 95%; }

      .welcome h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">Clincoo <span>AI</span></div>
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
  </div>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="logo">Clincoo <span>AI</span></div>

      <button class="new-chat-btn" onclick="newChat(); closeSidebar();">+ Chat Baru</button>

      <label>OpenRouter API Key</label>
      <input type="password" class="api-input" id="apiKey" placeholder="sk-or-v1-..." />

      <label style="margin-top:4px;">Model</label>
      <select class="model-select" id="modelSelect">
        <optgroup label="Gratis (Recommended)">
          <option value="qwen/qwen3.8-27b:free" selected>Qwen3.8 27B — Gratis</option>
          <option value="nvidia/nemotron-3-ultra-550b-a55b:free">Nemotron 3 Ultra — Gratis</option>
          <option value="openrouter/free">Free Router (Auto)</option>
        </optgroup>
        <optgroup label="Murah & Pintar">
          <option value="deepseek/deepseek-v4.1-flash">DeepSeek V4.1 Flash (~$0.05)</option>
          <option value="openai/gpt-6-luna">GPT-6 Luna (~$0.10)</option>
          <option value="z-ai/glm-5.3-flash">GLM 5.3 Flash (~$0.15)</option>
          <option value="xiaomi/mimo-v2.6-flash">MiMo V2.6 Flash (~$0.14)</option>
        </optgroup>
      </select>

      <div class="info">
        <p><strong>Gratis</strong> = rate limit terbatas</p>
        <p style="margin-top:6px;"><strong>Qwen3.8 27B</strong> = default terbaik gratis</p>
        <p style="margin-top:6px;"><strong>DeepSeek / Luna</strong> = paling pintar murah</p>
        <p style="margin-top:12px;">Powered by OpenRouter</p>
      </div>
    </aside>

    <main class="main">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <h1>Clincoo AI Chat</h1>
          <p>Fokus model gratis & murah yang pintar</p>
          <div class="suggestions">
            <div class="suggestion" onclick="ask('Jelaskan cara kerja Cloudflare Workers')">Cloudflare Workers</div>
            <div class="suggestion" onclick="ask('Buatkan contoh API payment Pakasir')">Contoh API Payment</div>
            <div class="suggestion" onclick="ask('Buatkan landing page modern dengan HTML CSS')">Buat Landing Page</div>
            <div class="suggestion" onclick="ask('Buatkan backend API Node.js sederhana')">Buat Backend API</div>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="input" rows="1" placeholder="Tulis pesan..." onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Kirim">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const welcomeEl = document.getElementById('welcome');
    const apiKeyInput = document.getElementById('apiKey');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    apiKeyInput.value = localStorage.getItem('or_key') || '';
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('or_key', apiKeyInput.value.trim());
    });

    let history = [];
    let isGenerating = false;

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    function newChat() {
      history = [];
      messagesEl.innerHTML = '';
      messagesEl.appendChild(welcomeEl);
      welcomeEl.style.display = 'block';
    }

    function ask(text) {
      inputEl.value = text;
      sendMessage();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function addMessage(role, content) {
      welcomeEl.style.display = 'none';
      const div = document.createElement('div');
      div.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'U' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;

      div.appendChild(avatar);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message assistant';
      div.id = 'typing';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      div.appendChild(avatar);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text || isGenerating) return;
      if (!apiKey) {
        alert('Masukkan OpenRouter API Key dulu (buka menu ☰ di kiri atas)');
        toggleSidebar();
        return;
      }

      isGenerating = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      addMessage('user', text);
      history.push({ role: 'user', content: text });
      showTyping();

      const model = document.getElementById('modelSelect').value;

      try {
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.href,
            'X-Title': 'Clincoo AI Chat'
          },
          body: JSON.stringify({
            model,
            messages: history,
            stream: true,
            temperature: 0.7
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || 'Request failed');
        }

        removeTyping();
        const bubble = addMessage('assistant', '');

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const data = JSON.parse(line.slice(6));
                const content = data.choices?.[0]?.delta?.content || '';
                if (content) {
                  fullText += content;
                  bubble.textContent = fullText;
                  messagesEl.scrollTop = messagesEl.scrollHeight;
                }
              } catch {}
            }
          }
        }

        history.push({ role: 'assistant', content: fullText });

      } catch (err) {
        removeTyping();
        addMessage('assistant', 'Error: ' + err.message);
      }

      isGenerating = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
